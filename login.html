<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background:linear-gradient(135deg,#2563eb,#7c3aed);
            font-family:Segoe UI,sans-serif;
        }

        .login-card{

            width:400px;
            padding:40px;

            background:white;

            border-radius:20px;

            box-shadow:0 10px 25px rgba(0,0,0,.2);
        }

        h1{
            text-align:center;
            margin-bottom:30px;
        }

        input{

            width:100%;

            padding:15px;

            margin-bottom:15px;

            border:1px solid #ddd;

            border-radius:10px;
        }

        button{

            width:100%;

            padding:15px;

            border:none;

            border-radius:10px;

            background:#2563eb;

            color:white;

            font-weight:bold;

            cursor:pointer;
        }

        button:hover{

            background:#1d4ed8;
        }

        #mensaje{

            margin-top:15px;

            text-align:center;

            color:red;
        }

    </style>

</head>

<body>

<div class="login-card">

    <h1>🛡️ Atlantic Moderation</h1>

    <input
      id="usuario"
      placeholder="Usuario">

    <input
      type="password"
      id="password"
      placeholder="Contraseña">

    <button onclick="login()">

        Ingresar

    </button>

    <p id="mensaje"></p>

</div>

<script>

async function login(){

    const usuario =
    document.getElementById("usuario").value;

    const password =
    document.getElementById("password").value;

    const respuesta = await fetch(
        "http://localhost:3000/login",
        {
            method:"POST",
            headers:{
                "Content-Type":"application/json"
            },
            body:JSON.stringify({
                usuario,
                password
            })
        }
    );

    const data = await respuesta.json();

    if(data.success){

        localStorage.setItem(
            "usuario",
            usuario
        );

        window.location.href =
        "index.html";

    }else{

        document.getElementById(
            "mensaje"
        ).textContent =
        "Credenciales incorrectas";
    }
}

</script>

</body>
</html>
